<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>状态栏歌词</title>
    <!-- 歌词内容以中文为主：Inter/Outfit 无中文覆盖，且外网加载失败会引起
         字体闪烁；直接使用系统字体栈（见 lyric-bar.css body 定义） -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/lyric-bar.css">
</head>
<body class="lyric-bar-body" data-theme="aurora-cyan">
    <!-- 边界提示：调整歌词条宽度/位置后由主窗口事件点亮，3s 后自动淡出 -->
    <div class="bar-boundary left" id="bar-boundary-left" aria-hidden="true"></div>
    <div class="bar-boundary right" id="bar-boundary-right" aria-hidden="true"></div>
    <div class="lyric-bar-root">
        <div class="lyric-bar-line" id="lyric-bar-line">
            <div class="lyric-bar-inner" id="lyric-bar-inner"></div>
        </div>
        <div class="lyric-bar-trans" id="lyric-bar-trans" hidden></div>
    </div>
    <script type="module" src="src/lyrics/lyric-bar.js"></script>
</body>
</html>
